# OLMo2-160M-dclm-ddp-oracle — the oracle probe ladder.
#
# Campaign A / experiment A1. NOT A METHOD: `oracle_probe` runs a real backward every
# step to read the true gradient, so it has neither the memory profile nor the
# forward-pass budget of a zero-order optimizer. Never table its memory or throughput
# against a ZO run.
#
# What it measures: how much probe alignment a learned sampler would have to deliver
# before the loss curve moves at all. The probe is built to hit an exact cosine c with
# the true gradient (see olmo/zo_optim.py::OracleProbe); sweeping c with everything else
# fixed gives loss-vs-alignment directly.
#
#   for c in 0 0.003 0.01 0.03 0.1; do ... --optimizer.oracle_probe_cosine=$c \
#       --run_name=A1-160M-oracle-c$c ; done
#
# c=0 is the control and reduces to isotropic MeZO. The decision it supports: historical
# AGZO sits at cosine ~3e-4. If the loss only responds at c >= 0.03, no realistic sampler
# closes that gap and the RL direction is dead.
#
# Geometry, data, schedule and eval are inherited verbatim from the 160M MeZO baseline.

run_name: oracle-160m-baseline
seed: 6198
dry_run: false

# Root of the data directory; every data path below is written relative to it.
# Override per machine with `export OLMO_DATA_ROOT=...` or `--data_root=...`.
data_root: ${oc.env:OLMO_DATA_ROOT,/bcm_lmv_fs/data/datasets/olmo}

wandb:
  name: ${run_name}
  project: zo-pretrain-hybrid-160m-test
  group: oracle-vs-hybrid-160m-test
  entity: null
  tags: [H-ZOP-005, oracle-probe, single-gpu]
  log_interval: 10

model:
  d_model: 768
  n_heads: 12
  n_layers: 12
  mlp_ratio: 4
  weight_tying: false
  alibi: false
  rope: true
  rope_theta: 500000

  flash_attention: true
  attention_dropout: 0.0
  include_bias: false
  block_type: sequential
  layer_norm_type: rms
  layer_norm_with_affine: true
  layer_norm_eps: 1e-6
  bias_for_layer_norm: false
  attention_layer_norm: true
  attention_layer_norm_with_affine: true
  norm_after: true
  activation_type: swiglu
  residual_dropout: 0.0
  embedding_dropout: 0.0
  max_sequence_length: 1024
  vocab_size: 100278
  embedding_size: 100352
  eos_token_id: 100257
  pad_token_id: 100277
  init_device: cuda
  init_fn: normal
  init_std: 0.02
  init_cutoff_factor: 3

softmax_auxiliary_loss: true
auxiliary_loss_multiplier: 1e-5
fused_loss: false

compile: null

optimizer:
  name: oracle_probe
  learning_rate: 3.0e-5      # A0b pre-check: 1e-4 unstable (late CE spread 0.45-1.3, spike to 37)
  weight_decay: 0.1
  decay_norm_and_bias: true
  decay_embeddings: false
  metrics_log_interval: 1
  zo_eps: 1.0e-3             # milestone_1 App. A, ZO-SGD row
  zo_perturbation_mode: two_side   # 2 forwards/step + 1 backward
  # Take the descent sign from the gradient we already hold instead of from two probe
  # forwards. At production zo_eps the finite difference is a chord, not a derivative,
  # and its error grows with c -- measured, c=0.10 trained 1.28 nats WORSE than c=0.03 at
  # both lr=1e-4 and lr=3e-5, i.e. the ladder read backwards. Exact mode removes zo_eps
  # from the instrument (it cancels), drops 2 forwards/step, and reports f(theta) rather
  # than f(theta+eps*z). Use 'spsa' to study the eps interaction itself.
  oracle_probe_sign: exact
  # Keep the measured sign, use the isotropic update magnitude. Without this the raw
  # SPSA estimate scales like c*sqrt(d) (~370x at c=0.03, d~1.5e8) and the ladder
  # measures step size rather than direction -- the first smoke diverged 11.5 -> 128
  # nats in eight steps. See olmo/zo_optim.py::OracleProbe.
  oracle_probe_update: matched
  # The ladder rung. Override per run; 0.0 is the isotropic control.
  oracle_probe_cosine: 0.30
  # Logs the *realised* cosine as a self-check on the construction: optim/cosine_qrge
  # must track optim/cosine_target. An instrument that only echoes its setting is
  # worthless, so it is measured rather than asserted.
  zo_fo_cosine_interval: 100
  # --- inherited MeZO knobs; the probe direction is the only thing that differs ---
  mezo_momentum: 0.0
  mezo_vector_sampling_type: standard_normal
  mezo_num_pert_samples: 1

scheduler:
  name: cosine_with_warmup
  units: tokens
  t_warmup: 2000000
  t_max: 500000000
  alpha_f: 0.1
  warmup_min_lr: 0.0

tokenizer:
  identifier: tokenizers/allenai_dolma2.json
  truncate_direction: right

save_folder: ./runs/${run_name}
save_overwrite: false

save_interval: 200
save_interval_ephemeral: 200
save_num_checkpoints_to_keep: 2
save_interval_unsharded: 200
save_num_unsharded_checkpoints_to_keep: 2

load_path: null
try_load_latest_save: false

global_train_batch_size: 32
device_train_microbatch_size: 8

max_duration: 6200

precision: amp_bf16

distributed_strategy: single

ddp:
  grad_sync_mode: batch
  find_unused_params: false

max_grad_norm: 1.0
max_grad_norm_ratio: null

speed_monitor:
  window_size: 1

gen1_gc_interval: 10

eval_interval: 1000
eval_subset_num_batches: -1
device_eval_batch_size: ${device_train_microbatch_size}

evaluators:
  # TODO(you): add the in-domain DCLM validation set here. milestone_1 Sec. 6 flags that
  # DCLM-trained runs were scored only on out-of-domain wiki, which makes their
  # train-heldout gaps non-comparable with the wiki-trained baselines. The path lives on
  # the other dev's branch (8 runs log eval/dclm-validation/CrossEntropyLoss).
  - label: dolma_wiki-validation
    type: lm
    data:
      pad_direction: right
      num_workers: 4
      drop_last: true
      pin_memory: true
      prefetch_factor: 2
      persistent_workers: true
      memmap_dtype: uint32
      paths:
        - ${data_root}/wikitext/validation/0_00000.npy

data:
  pad_direction: right
  num_workers: 8
  drop_last: true
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: true
  memmap_dtype: uint32
  timeout: 0
  instance_filter:
    repetition_max_period: 13
    repetition_min_period: 1
    repetition_max_count: 32
  paths:
    - ${data_root}/dcml/subset-6B

